# Independent of both application release directories.
# Only Tailscale TCP 8317 forwards to this loopback listener.
map $http_upgrade $shiny_cpa_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 127.0.0.1:18318;
    server_name _;
    client_max_body_size 32m;
    access_log off;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $shiny_cpa_connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Monitoring analytics and usage exports are JSON/NDJSON responses. Compress
    # them at the private management edge before they cross the Tailscale link.
    # The upstream can still stream; this only reduces bytes on the wire.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/x-ndjson text/plain text/event-stream;

    location = / { return 302 /management.html; }
    location = /management.html {
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:18317;
    }
    location = /favicon.ico { proxy_pass http://127.0.0.1:18317; }
    location = /apple-touch-icon.png { proxy_pass http://127.0.0.1:18317; }
    location = /health { proxy_pass http://127.0.0.1:18317; }
    location = /status { proxy_pass http://127.0.0.1:18317; }
    location = /setup { proxy_pass http://127.0.0.1:18317; }
    location ^~ /usage-service/ { proxy_pass http://127.0.0.1:18317; }
    location ^~ /v0/management/ { proxy_pass http://127.0.0.1:18317; }
    location ^~ /v0/resource/plugins/ { proxy_pass http://127.0.0.1:18317; }
    location = /models { proxy_pass http://127.0.0.1:18317; }

    location = /cpa { return 302 /cpa/management.html; }
    location = /cpa/ { return 302 /cpa/management.html; }
    location = /cpa/management.html {
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8317/management.html;
    }

    # Includes v8 management, inference, WebSocket, OAuth and future CPA paths.
    location / { proxy_pass http://127.0.0.1:8317; }
}
