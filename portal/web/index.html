<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Shiny API 统一模型接入、使用教程与工具资源。">
  <title>Shiny API — 一个 Key，接入你的 AI 工作流</title>
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/content.css">
  <link rel="modulepreload" href="/app.js">
  <script src="/boot.js" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至内容</a>
  
  <header class="site-header" id="site-header"></header>
  <main id="main" tabindex="-1"><div class="container loading">正在加载 Shiny…</div></main>
  <footer class="site-footer" id="site-footer"></footer>
  <dialog class="search-dialog" id="search-dialog" aria-labelledby="search-title">
    <form method="dialog" class="search-top"><label for="global-search" id="search-title">搜索教程与资源</label><button class="icon-button" aria-label="关闭搜索" value="close">×</button></form>
    <div class="search-field"><input id="global-search" type="search" placeholder="搜索 Codex、CC Switch、503…" autocomplete="off"></div>
    <div id="search-results" class="search-results"></div>
    <p class="search-hint">按 Esc 关闭<span>搜索教程与资源</span></p>
  </dialog>
  <div class="toast" role="status" aria-live="polite" id="toast"></div>
  <dialog class="delete-dialog" id="delete-article-dialog" aria-labelledby="delete-article-title">
    <h2 id="delete-article-title">删除教程草稿</h2>
    <p id="delete-article-description"></p>
    <div class="admin-actions"><button type="button" class="btn btn-sm" data-action="cancel-delete-article">取消</button><button type="button" class="btn btn-sm btn-danger" data-action="confirm-delete-article">确认删除草稿</button></div>
  </dialog>
  <noscript><p class="container">请启用 JavaScript 查看页面。</p></noscript>
</body>
</html>
