# Canonical website entry. Keep independent from portal/New API frontend includes.
server {
    listen 80;
    listen [::]:80;
    server_name www.shinyapi.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://shinyapi.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.shinyapi.com;

    ssl_certificate /etc/letsencrypt/live/www.shinyapi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.shinyapi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://shinyapi.com$request_uri;
    }
}
