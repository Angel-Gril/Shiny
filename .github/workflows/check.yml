name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r portal/backend/requirements.txt
      - run: python scripts/check-secrets.py --all
      - run: python -m unittest discover -s portal/backend -p 'test_*.py'
