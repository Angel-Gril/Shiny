name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r portal/backend/requirements.txt
      - run: python scripts/check-secrets.py --all
      - run: python -m unittest discover -s portal/backend -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/shiny-browser" playwright@1.58.2
      - run: '"$RUNNER_TEMP/shiny-browser/node_modules/.bin/playwright" install --with-deps chromium'
      - run: node portal/test-lazy-loading.mjs
        timeout-minutes: 5
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/shiny-browser/node_modules/playwright
      - run: bun run portal/particles/test-scenes.ts
      - run: node portal/test-particles.mjs
        timeout-minutes: 8
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/shiny-browser/node_modules/playwright
  new-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fixture-ci-only
          POSTGRES_DB: fixture
        ports:
          - 15321:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture-ci-only
          MYSQL_DATABASE: fixture
        ports:
          - 13316:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: new-api/go.sum
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: new-api/web
      - run: bun run typecheck
        working-directory: new-api/web
      - run: bunx vitest run src/features/user-insight/__tests__/user-details.test.tsx --pool=forks --maxWorkers=1 --no-file-parallelism
        working-directory: new-api/web
      - run: go test ./controller -run '^(TestUserInsight|TestRequestPolicyRetryAvoidsUsedChannelsDatabaseMatrix)' -count=1
        working-directory: new-api
        env:
          TEST_MYSQL_DSN: root:fixture-ci-only@tcp(127.0.0.1:13316)/fixture?charset=utf8mb4&parseTime=True&loc=Local
          TEST_POSTGRES_DSN: postgres://postgres:fixture-ci-only@127.0.0.1:15321/fixture?sslmode=disable
